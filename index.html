<!DOCTYPE html>
<html lang="ru" class="no-trans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAMA Invest</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f0);
    --text: var(--tg-theme-text-color, #1c1c1c);
    --hint: var(--tg-theme-hint-color, #8a8a8a);
    --line: rgba(128, 128, 128, 0.2);
    --up: #2e7d4f;
    --down: #b8433b;
    --warn: #9a6a12;
  }
  html[data-scheme="dark"] {
    --up: #63c08b;
    --down: #ec6f66;
    --warn: #d9a64a;
  }
  /* Тема, выбранная вручную кнопкой, перекрывает цвета Telegram */
  html[data-theme="light"] {
    --bg: #ffffff; --bg2: #f2f2f0; --text: #1c1c1c; --hint: #8a8a8a;
  }
  html[data-theme="dark"] {
    --bg: #17181a; --bg2: #232427; --text: #ececec; --hint: #8e9095;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    background: var(--bg);
    color: var(--text);
  }
  /* --top-inset и --bottom-inset выставляет скрипт: в полноэкранном режиме это место под часами телефона и кнопками Telegram */
  main {
    padding: calc(16px + var(--top-inset, 0px)) 16px calc(84px + max(env(safe-area-inset-bottom), var(--bottom-inset, 0px)));
    max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 26px; font-weight: 700; margin: 4px 0 4px; letter-spacing: -0.3px; }
  h2 { font-size: 15px; font-weight: 600; margin: 26px 0 8px; }
  p { margin: 0 0 12px; }
  .hint { color: var(--hint); font-size: 14px; }
  .num { font-variant-numeric: tabular-nums; }
  .big { font-size: 36px; font-weight: 650; letter-spacing: -0.8px; margin: 2px 0 2px; font-variant-numeric: tabular-nums; }
  .up, .row .sub.up { color: var(--up); }
  .down, .row .sub.down { color: var(--down); }

  .group { background: var(--bg2); border-radius: 14px; overflow: hidden; margin: 0 0 8px; }
  .row {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 13px 16px;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .row:last-child { border-bottom: 0; }
  .row.static { cursor: default; }
  .row .main { flex: 1; min-width: 0; }
  .row .title { font-weight: 500; }
  .row .sub { font-size: 13px; color: var(--hint); margin-top: 1px; }
  .row .right { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .right .sub { margin-top: 1px; }
  .chev { color: var(--hint); font-size: 18px; }
  .right-stack { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; white-space: nowrap; }

  .chip { display: inline-block; font-size: 12px; padding: 2px 7px; border-radius: 6px; border: 1px solid currentColor; white-space: nowrap; }
  .chip.ok { color: var(--up); }
  .chip.review { color: var(--warn); }
  .chip.pending { color: var(--hint); }
  .chip.disputed { color: var(--warn); border-style: dashed; }

  .empty { padding: 18px 16px; color: var(--hint); font-size: 14px; }
  .note { font-size: 12px; color: var(--hint); line-height: 1.5; margin: 18px 2px 0; }

  .btn {
    display: block; width: 100%; padding: 14px; margin-top: 12px;
    border: 0; border-radius: 12px; cursor: pointer;
    font: inherit; font-weight: 600;
    background: var(--text); color: var(--bg);
  }
  .btn.ghost { background: var(--bg2); color: var(--text); }
  .btn.danger { background: transparent; color: var(--down); }
  .back { background: none; border: 0; color: var(--hint); font: inherit; padding: 0; margin-bottom: 12px; cursor: pointer; }

  label { display: block; font-size: 14px; color: var(--hint); margin: 16px 0 6px; }
  input, select {
    width: 100%; padding: 12px 14px; font: inherit; font-size: 16px;
    color: var(--text); background: var(--bg2);
    border: 1px solid var(--line); border-radius: 10px; outline: none;
    appearance: none; -webkit-appearance: none;
  }
  input:focus, select:focus { border-color: var(--hint); }
  .field-hint { font-size: 12px; color: var(--hint); margin-top: 6px; }
  input[type="date"] { min-height: 48px; text-align: left; }
  .pct-input { width: 84px; text-align: right; padding: 9px 12px; }
  .pct-wrap { display: flex; align-items: center; gap: 6px; color: var(--hint); }
  .sum-big { font-size: 22px; font-weight: 650; }
  .done { color: var(--up); }

  .seg { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); background: var(--bg2); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 9px; border-radius: 8px; color: var(--hint); font: inherit; font-size: 15px; cursor: pointer; }
  .seg button.on { color: var(--text); font-weight: 600; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; border: 0; cursor: pointer;
    background: var(--bg2); color: var(--text);
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn:focus-visible, .seg button:focus-visible, .btn:focus-visible { outline: 2px solid var(--hint); outline-offset: 2px; }
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .seg-sm { flex-shrink: 0; }
  .seg-sm button { padding: 6px 14px; font-size: 15px; min-width: 44px; }

  .result { background: var(--bg2); border-radius: 14px; padding: 16px; margin-top: 20px; }
  .result .line { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-variant-numeric: tabular-nums; }
  .result .total { font-size: 22px; font-weight: 650; margin-top: 8px; }

  .detail-row { display: flex; justify-content: space-between; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .detail-row:last-child { border-bottom: 0; }
  .detail-row > span:first-child { color: var(--hint); }
  .detail-row > span:last-child { text-align: right; }
  .asset-price { font-size: 22px; font-weight: 600; margin: 6px 0 2px; }
  .asset-price .num > span + span { font-size: 15px; font-weight: 500; margin-left: 4px; }

  .lesson p { line-height: 1.6; }
  .steps { counter-reset: s; padding: 0; margin: 0; list-style: none; }
  .steps li { position: relative; padding: 0 0 16px 36px; line-height: 1.55; }
  .steps li::before {
    counter-increment: s; content: counter(s);
    position: absolute; left: 0; top: 0;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--bg2); font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }

  nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: grid; grid-template-columns: repeat(5, 1fr);
    padding: 6px 4px calc(6px + max(env(safe-area-inset-bottom), var(--bottom-inset, 0px)));
    background: var(--bg); border-top: 1px solid var(--line);
  }
  nav button {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: 0; padding: 4px 0; cursor: pointer;
    color: var(--hint); font: inherit; font-size: 11px;
  }
  nav button.on { color: var(--text); font-weight: 600; }
  nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  /* ================= ДВИЖЕНИЕ ================= */
  :root { --ease: cubic-bezier(.2, .8, .2, 1); }

  /* Переходы между экранами: вглубь — справа, назад — слева, вкладки — лёгкое появление */
  @keyframes in-push { from { opacity: 0; transform: translateX(36px); } }
  @keyframes in-pop  { from { opacity: 0; transform: translateX(-36px); } }
  @keyframes in-tab  { from { opacity: 0; transform: translateY(10px); } }
  main.anim-push { animation: in-push .4s var(--ease); }
  main.anim-pop  { animation: in-pop .4s var(--ease); }
  main.anim-tab  { animation: in-tab .34s var(--ease); }

  /* Отклик на нажатие */
  .row, .btn, .icon-btn, nav button, .seg button { transition: transform .12s var(--ease), background-color .25s ease, color .25s ease; }
  button.row:active { background-color: rgba(128, 128, 128, .14); transition-duration: 0s; }
  .btn:active { transform: scale(.98); }
  .icon-btn:active { transform: scale(.9); }
  nav button:active svg { transform: scale(.88); }
  nav svg { transition: transform .15s var(--ease); }
  @keyframes tab-pop { 40% { transform: translateY(-3px) scale(1.08); } }
  nav button.on svg { animation: tab-pop .4s var(--ease); }

  /* Переключатели: плашка выбора плавно переезжает */
  .seg { position: relative; isolation: isolate; }
  .seg::before {
    content: ""; position: absolute; z-index: -1; top: 3px; bottom: 3px; left: 3px;
    border-radius: 8px; background: var(--bg);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
    transition: transform .3s var(--ease);
    width: calc((100% - 6px) / var(--n, 2)); transform: translateX(calc(100% * var(--i, 0)));
  }
  .seg button.on { background: none; }

  /* Смена темы — плавно, иконка поворачивается */
  body, .group, nav, input, select, .result, .chip, .seg, .steps li::before { transition: background-color .4s ease, color .4s ease, border-color .4s ease; }
  @keyframes icon-in { from { opacity: 0; transform: rotate(-90deg) scale(.6); } }
  .icon-btn svg.spin { animation: icon-in .35s var(--ease); }

  /* Цена изменилась — короткая подсветка */
  @keyframes flash-up   { from { background-color: rgba(46, 160, 90, .28); } }
  @keyframes flash-down { from { background-color: rgba(220, 70, 60, .26); } }
  .flash-up, .flash-down { border-radius: 5px; margin: 0 -3px; padding: 0 3px; }
  .flash-up   { animation: flash-up 1.1s ease-out; }
  .flash-down { animation: flash-down 1.1s ease-out; }

  /* Только что добавленная позиция */
  @keyframes just-added { from { background-color: rgba(128, 128, 128, .2); } }
  .row.just-added { animation: just-added 1.4s ease-out; }

  /* Заглушка, пока грузятся цены */
  @keyframes shimmer { 50% { opacity: .45; } }
  .skel { display: inline-block; width: 64px; height: 14px; border-radius: 4px; background: var(--line); animation: shimmer 1.2s ease-in-out infinite; vertical-align: middle; }


  /* ================= ГРАФИКИ ================= */
  .chart { margin: 14px 0 8px; min-height: 40px; transition: opacity .3s ease; }
  .chart.loading { opacity: .5; }
  .chart.loading:empty { height: 150px; border-radius: 12px; background: var(--bg2); animation: shimmer 1.2s ease-in-out infinite; }
  .chart-meta { display: flex; align-items: baseline; gap: 8px; min-height: 20px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .chart-meta .strong { font-weight: 600; color: var(--text); }
  .chart-svg { display: block; width: 100%; height: auto; margin-top: 8px; overflow: visible; color: var(--hint); touch-action: pan-y; cursor: crosshair; outline: none; }
  .chart-svg:focus-visible { outline: 2px solid var(--hint); outline-offset: 4px; border-radius: 4px; }
  .chart-svg.up, .spark svg.up { color: var(--up); }
  .chart-svg.down, .spark svg.down { color: var(--down); }
  .c-line { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .c-area { fill: currentColor; fill-opacity: .1; stroke: none; }
  .c-cross { stroke: var(--hint); stroke-width: 1; }
  .c-dot { fill: currentColor; stroke: var(--bg); stroke-width: 2; }
  .chart-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--hint); margin-top: 6px; }
  .chart-empty { min-height: 80px; padding: 14px 16px; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.45; color: var(--hint); font-size: 13px; background: var(--bg2); border-radius: 12px; }
  .chart-svg.draw .c-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw-line 1.1s var(--ease) forwards; }
  .chart-svg.draw .c-area { animation: fade-in 1.1s ease; }
  .chart-svg.draw .c-dot { animation: fade-in .35s 1s both; }
  @keyframes draw-line { to { stroke-dashoffset: 0; } }
  @keyframes fade-in { from { opacity: 0; } }
  .seg-period { margin-bottom: 4px; }
  .seg-period button { padding: 6px; font-size: 14px; }
  .spark { width: 56px; height: 26px; flex-shrink: 0; color: var(--hint); }
  .spark svg { display: block; width: 56px; height: 26px; overflow: visible; }
  .spark .c-line { stroke-width: 1.6; }
  html.no-trans * { transition: none !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

// ---------- форматирование ----------
const nf = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
const round2 = v => Math.round(v * 100) / 100;
const rub = v => nf.format(round2(v)) + ' ₽';
const sign = v => (v > 0 ? '+' : v < 0 ? '−' : '');
const signedRub = v => sign(v) + nf.format(Math.abs(round2(v))) + ' ₽';
const SYM = { rub: '₽', usd: '$' };
const money = (v, c = 'rub') => nf.format(round2(v)) + ' ' + SYM[c];
const signedMoney = (v, c = 'rub') => sign(v) + nf.format(Math.abs(round2(v))) + ' ' + SYM[c];

// Валюта отображения: в разделе «Криптовалюта» её выбирает пользователь, в остальных — рубль.

const dispCur = sec => (sec === 'crypto' ? cryptoCur : 'rub');
const pctOf = (v, base) => base ? sign(v) + nf.format(Math.abs(round2(v / base * 100))) + '%' : '';
const tone = v => (v > 0 ? 'up' : v < 0 ? 'down' : '');
const num = s => { const n = parseFloat(String(s).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : NaN; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- хранение ----------
function storeGet(key) {
  return new Promise(resolve => {
    if (useCloud) {
      tg.CloudStorage.getItem(key, (err, val) => resolve(err ? null : (val || null)));
    } else {
      try { resolve(localStorage.getItem(key)); } catch (e) { resolve(null); }
    }
  });
}
function storeSet(key, val) {
  return new Promise(resolve => {
    if (useCloud) {
      tg.CloudStorage.setItem(key, val, err => resolve(!err));
    } else {
      try { localStorage.setItem(key, val); resolve(true); } catch (e) { resolve(false); }
    }
  });
}
async function loadAll() {
  for (const s of SECTIONS) {
    const raw = await storeGet('pf_' + s);
    try { const arr = JSON.parse(raw); pf[s] = Array.isArray(arr) ? arr : []; } catch (e) { pf[s] = []; }
  }
  const c = await storeGet('cur_crypto');
  if (c === 'rub' || c === 'usd') cryptoCur = c;
  try { const v = JSON.parse(await storeGet('purify_pct')); if (v && typeof v === 'object') purifyPct = v; } catch (e) {}
  try { const v = JSON.parse(await storeGet('purified')); if (v && typeof v === 'object') purified = v; } catch (e) {}
  const t = await storeGet('theme');
  if (t === 'light' || t === 'dark') {
    themePref = t;
    try { localStorage.setItem('theme', t); } catch (e) {}
  }
}
async function persist(sec) {
  const data = JSON.stringify(pf[sec]);
  if (data.length > 4000) { alertMsg('В разделе слишком много позиций. Удалите лишние.'); return false; }
  const ok = await storeSet('pf_' + sec, data);
  if (!ok) alertMsg('Не удалось сохранить. Проверьте интернет и попробуйте ещё раз.');
  return ok;
}

// ---------- живые цены ----------
const prices = {};                         // id актива → цена за 1 шт. в рублях
const changes = {};                        // id актива → изменение цены за день, %
const setChange = (id, v, target = changes) => { if (typeof v === 'number' && isFinite(v)) target[id] = v; };
const pricesUsd = {};                      // крипта: цена в долларах
const changesUsd = {};
let usdRub = null;                         // курс доллара в рублях
try { const r = parseFloat(localStorage.getItem('usd_rub')); if (r > 0) usdRub = r; } catch (e) {}
const priceErr = { moex: false, cg: false };
let pricesAt = null;

async function fetchJSON(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function issRows(block) {
  if (!block || !block.columns) return [];
  return block.data.map(row => { const o = {}; block.columns.forEach((c, i) => { o[c] = row[i]; }); return o; });
}
const firstPositive = (...vals) => vals.find(v => typeof v === 'number' && v > 0);

async function loadStockPrices() {
  const list = CATALOG.stocks.map(a => a.ticker).join(',');
  const j = await fetchJSON('https://iss.moex.com/iss/engines/stock/markets/shares/boards/TQBR/securities.json'
    + '?securities=' + list + '&iss.meta=off&iss.only=securities,marketdata');
  const prev = {};
  issRows(j.securities).forEach(r => { prev[r.SECID] = r.PREVPRICE; });
  issRows(j.marketdata).forEach(r => {
    const v = firstPositive(r.LAST, r.LCURRENTPRICE, r.MARKETPRICE, prev[r.SECID]);
    const a = CATALOG.stocks.find(x => x.ticker === r.SECID);
    if (a && v) prices[a.id] = v;
    if (a) setChange(a.id, r.LASTTOPREVPRICE);
  });
}

async function loadSukukPrices() {
  for (const a of CATALOG.sukuk) {
    if (!a.moex) continue;
    const j = await fetchJSON('https://iss.moex.com/iss/engines/stock/markets/bonds/boards/' + a.moex.board
      + '/securities/' + a.moex.secid + '.json?iss.meta=off&iss.only=securities,marketdata');
    const s = issRows(j.securities)[0] || {};
    const m = issRows(j.marketdata)[0] || {};
    const pct = firstPositive(m.LAST, m.LCURRENTPRICE, m.MARKETPRICE, s.PREVPRICE);
    if (s.FACEVALUE > 0) faceValues[a.id] = s.FACEVALUE;
    if (pct && s.FACEVALUE > 0) prices[a.id] = pct / 100 * s.FACEVALUE;   // цена в % от номинала → рубли
    setChange(a.id, m.LASTTOPREVPRICE);
  }
}

async function loadCryptoPrices() {
  const ids = CATALOG.crypto.map(a => a.cg).filter(Boolean).join(',');
  if (!ids) return;
  const j = await fetchJSON('https://api.coingecko.com/api/v3/simple/price?ids=' + ids + '&vs_currencies=rub,usd&include_24hr_change=true');
  const rates = [];
  CATALOG.crypto.forEach(a => {
    const d = j[a.cg];
    if (!d) return;
    if (d.rub > 0) prices[a.id] = d.rub;
    if (d.usd > 0) pricesUsd[a.id] = d.usd;
    if (d.rub > 0 && d.usd > 0) rates.push(d.rub / d.usd);
    setChange(a.id, d.rub_24h_change);
    setChange(a.id, d.usd_24h_change, changesUsd);
  });
  if (rates.length) {
    usdRub = rates.reduce((s, r) => s + r, 0) / rates.length;
    try { localStorage.setItem('usd_rub', String(usdRub)); } catch (e) {}
  }
}

// id → 'up' | 'down': какие цены изменились при последнем обновлении (для подсветки)
let flashes = {};

async function refreshPrices() {
  const old = Object.assign({}, prices);
  const [st, su, cr] = await Promise.allSettled([loadStockPrices(), loadSukukPrices(), loadCryptoPrices()]);
  priceErr.moex = st.status === 'rejected' && su.status === 'rejected';
  priceErr.cg = cr.status === 'rejected';
  pricesAt = new Date();
  flashes = {};
  for (const id in prices) {
    if (old[id] && prices[id] !== old[id]) flashes[id] = prices[id] > old[id] ? 'up' : 'down';
  }
  if (!scrubbing && ['home', 'sukuk', 'stocks', 'crypto', 'asset'].includes(cur().name)) render(false);
  flashes = {};
}
const flashCls = id => (flashes[id] ? 'flash-' + flashes[id] : '');

function priceStatus() {
  if (!pricesAt) return 'Загружаем цены…';
  if (priceErr.moex && priceErr.cg) return 'Не удалось загрузить цены. Показаны последние сохранённые.';
  const t = pricesAt.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  let s = 'Цены обновлены в ' + t + ', обновляются каждые 30 секунд. Мосбиржа бесплатно отдаёт их с задержкой 15 минут. Процент — изменение за день.';
  if (priceErr.moex) s += ' Цены Мосбиржи сейчас недоступны.';
  if (priceErr.cg) s += ' Цены криптовалют сейчас недоступны.';
  return s;
}

function livePrice(id, c = 'rub') {
  const src = c === 'usd' ? pricesUsd : prices;
  return (id && src[id] > 0) ? src[id] : null;
}
function changeHtml(id, c = 'rub') {
  const v = (c === 'usd' ? changesUsd : changes)[id];
  if (typeof v !== 'number') return '';
  return ` <span class="${tone(v)}">${sign(v)}${nf.format(Math.abs(round2(v)))}%</span>`;
}
function priceLine(id, c = 'rub') {
  const v = livePrice(id, c);
  if (!v) return pricesAt ? '' : '<span class="skel" aria-label="Загрузка цены"></span>';
  return `<span class="num"><span class="${flashCls(id)}">${money(v, c)}</span>${changeHtml(id, c)}</span>`;
}
// Перевод суммы между рублём и долларом по текущему курсу.
function conv(v, from, to) {
  if (from === to || !usdRub) return v;
  return from === 'usd' ? v * usdRub : v / usdRub;
}
const posCur = p => p.c || 'rub';
const priceOf = (p, c = 'rub') => livePrice(p.a, c) || conv(p.p, posCur(p), c);
const costOf = (p, c = 'rub') => conv(p.b, posCur(p), c);

// ---------- расчёты ----------
function secTotals(sec, c = 'rub') {
  let value = 0, cost = 0;
  for (const p of pf[sec]) { value += p.q * priceOf(p, c); cost += p.q * costOf(p, c); }
  return { value, cost, pl: value - cost };
}
function allTotals() {
  let value = 0, cost = 0;
  for (const s of SECTIONS) { const t = secTotals(s); value += t.value; cost += t.cost; }
  return { value, cost, pl: value - cost };
}
const findAsset = (sec, id) => CATALOG[sec].find(a => a.id === id);

// ---------- навигация ----------
const cur = () => stack[stack.length - 1];
function go(name, params) { stack.push(Object.assign({ name }, params || {})); render(true, 'push'); }
function back() { if (stack.length > 1) { stack.pop(); render(true, 'pop'); } }
function tab(name, anim = 'tab') {
  // Повторное нажатие на открытую вкладку — плавно наверх, как в обычных приложениях
  if (stack.length === 1 && stack[0].name === name) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (anim === 'tab') hapticSelect();
  stack = [{ name }];
  render(true, anim);
}

function positionRow(sec, p) {
  const c = dispCur(sec);
  const price = priceOf(p, c);
  const value = p.q * price, pl = value - p.q * costOf(p, c);
  return `<button class="row${p.i === justAdded ? ' just-added' : ''}" data-go="edit" data-sec="${sec}" data-pid="${esc(p.i)}">
    <div class="main"><div class="title">${esc(p.n)}</div><div class="sub num">${nf.format(p.q)} шт. по <span class="${p.a ? flashCls(p.a) : ''}">${money(price, c)}</span>${p.a ? changeHtml(p.a, c) : ''}</div></div>
    <div class="right"><div>${money(value, c)}</div><div class="sub ${tone(pl)}">${signedMoney(pl, c)}</div></div>
  </button>`;
}

// Валюта формы: у существующей позиции — та, в которой её внесли; у новой — выбранная в разделе.
function editCur(c) {
  const p = c.pid ? pf[c.sec].find(x => x.i === c.pid) : null;
  return p ? posCur(p) : dispCur(c.sec);
}

  section(c) {

function zakatResult() {
  const v = k => { const n = num(zk[k]); return isNaN(n) ? 0 : n; };
  const grams = zk.basis === 'gold' ? 85 : 595;
  const gram = num(zk.gram);
  const net = v('cash') + v('inv') + v('metal') + v('recv') - v('debt');
  if (!(gram > 0)) return '<div class="hint">Введите цену грамма, чтобы рассчитать нисаб.</div>';
  const nisab = grams * gram;
  let out = `<div class="line"><span class="hint">Нисаб</span><span>${rub(nisab)}</span></div>
             <div class="line"><span class="hint">Облагаемая сумма</span><span>${rub(net)}</span></div>`;
  if (net < nisab) out += '<div class="total">Закят не обязателен</div><div class="hint">Сумма ниже нисаба.</div>';
  else out += `<div class="line"><span class="hint">Ставка</span><span>2,5%</span></div><div class="total">К выплате: ${rub(net * 0.025)}</div>`;
  return out;
}

// ---------- действия ----------
async function savePosition() {
  const c = cur(), sec = c.sec;
  const aid = $('#f-asset').value;
  const asset = findAsset(sec, aid);
  const name = asset ? asset.name : $('#f-name').value.trim();
  const q = num($('#f-q').value), b = num($('#f-b').value);
  let price = num($('#f-p').value);
  if (!name) return alertMsg('Укажите название актива.');
  if (!(q > 0)) return alertMsg('Укажите количество больше нуля.');
  if (isNaN(b) || b < 0) return alertMsg('Укажите цену покупки.');
  if (isNaN(price) || price < 0) price = b;
  const fc = editCur(c);
  const live = asset ? livePrice(asset.id, fc) : null;
  if (live) price = live;

  const dEl = $('#f-d');
  const data = { a: asset ? asset.id : '', n: name, q, b, p: price, c: fc, d: dEl && /^\d{4}-\d{2}-\d{2}$/.test(dEl.value) ? dEl.value : '' };
  const before = JSON.stringify(pf[sec]);
  if (c.pid) {
    const p = pf[sec].find(x => x.i === c.pid);
    if (p) Object.assign(p, data);
  } else {
    const id = Date.now().toString(36);
    pf[sec].push(Object.assign({ i: id }, data));
    justAdded = id;
  }
  if (await persist(sec)) { haptic('success'); tab(sec, 'pop'); }
  else pf[sec] = JSON.parse(before);
}

function deletePosition() {
  const c = cur(), sec = c.sec;
  confirmMsg('Удалить позицию?', async ok => {
    if (!ok) return;
    const before = pf[sec];
    pf[sec] = pf[sec].filter(x => x.i !== c.pid);
    if (await persist(sec)) { haptic('success'); tab(sec, 'pop'); }
    else pf[sec] = before;
  });
}

let justAdded = null;

let countRaf = 0;
const reduceMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };

// Сумма портфеля на главной «докручивается» до нового значения
function countTotal() {
  const el = $('#total');
  if (!el) return;
  const to = allTotals().value;
  const from = shownTotal === null ? 0 : shownTotal;
  shownTotal = to;
  cancelAnimationFrame(countRaf);
  if (from === to || reduceMotion()) { el.textContent = rub(to); return; }
  const start = performance.now(), dur = from === 0 ? 1100 : 800;
  const step = now => {
    const k = Math.min(1, (now - start) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = k < 1 ? rub(Math.round(from + (to - from) * e)) : rub(to);
    if (k < 1) countRaf = requestAnimationFrame(step);
  };
  el.textContent = rub(Math.round(from));
  countRaf = requestAnimationFrame(step);
}

// ---------- дивиденды и очищение ----------
let purifyPct = {};       // свои проценты пользователя: id акции → %
let purified = {};        // отмеченные как очищенные выплаты: 'LKOH|2026-07-01' → true
const incomeCache = {};   // 'div|LKOH' / 'cpn|veb-59po' → { at, rows, err }
const incomePending = {};
const INCOME_TTL = 6 * 3600 * 1000;

const isoDay = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const lowerKeys = o => { const r = {}; for (const k in o) r[k.toLowerCase()] = o[k]; return r; };
const fmtDay = iso => new Date(iso + 'T12:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' }).replace(/\s?г\.$/, '');
const RUB_CODES = ['RUB', 'SUR', 'RUR'];

async function fetchIncome(kind, a) {
  if (kind === 'div') {
    const j = await fetchJSON('https://iss.moex.com/iss/securities/' + a.ticker + '/dividends.json?iss.meta=off');
    return issRows(j.dividends).map(lowerKeys)
      .filter(r => r.registryclosedate && r.value > 0 && RUB_CODES.includes(String(r.currencyid || 'RUB').toUpperCase()))
      .map(r => ({ date: String(r.registryclosedate).slice(0, 10), rec: String(r.registryclosedate).slice(0, 10), value: r.value }));
  }
  const j = await fetchJSON('https://iss.moex.com/iss/securities/' + a.moex.secid + '/bondization.json?iss.meta=off&iss.only=coupons');
  return issRows(j.coupons).map(lowerKeys).filter(r => r.coupondate).map(r => {
    const v = r.value_rub > 0 ? r.value_rub : r.value > 0 ? r.value : null;
    const date = String(r.coupondate).slice(0, 10);
    return { date, rec: r.recorddate ? String(r.recorddate).slice(0, 10) : date, value: v };
  });
}

function ensureIncome(kind, a) {
  const key = kind + '|' + a.id;
  const c = incomeCache[key];
  if (c && Date.now() - c.at < (c.err ? 120000 : INCOME_TTL)) return Promise.resolve(c);
  if (!incomePending[key]) {
    incomePending[key] = fetchIncome(kind, a)
      .then(rows => (incomeCache[key] = { at: Date.now(), rows }))
      .catch(e => (incomeCache[key] = { at: Date.now(), rows: [], err: String(e && e.message || e) }))
      .finally(() => { delete incomePending[key]; });
  }
  return incomePending[key];
}

// Бумаги в портфеле, по которым бывают выплаты
function incomeAssets() {
  const out = [], seen = {};
  for (const sec of ['stocks', 'sukuk']) {
    for (const p of pf[sec]) {
      const a = p.a && findAsset(sec, p.a);
      if (!a || !hasHistory(sec, a) || seen[a.id]) continue;
      seen[a.id] = 1;
      out.push({ sec, a, kind: sec === 'stocks' ? 'div' : 'cpn' });
    }
  }
  return out;
}
const hasIncomeAssets = () => incomeAssets().length > 0;

// Сколько бумаг было на дату отсечки. Без даты покупки считаем, что бумага была.
function qtyOn(sec, id, recDate) {
  return pf[sec].filter(p => p.a === id && (!p.d || p.d < recDate)).reduce((s, p) => s + p.q, 0);
}
const purifyOf = a => (purifyPct[a.id] != null ? purifyPct[a.id] : (a.purify != null ? a.purify : null));

function incomeEvents() {
  const today = isoDay(new Date());
  const yearAgo = isoDay(new Date(Date.now() - 365 * 86400000));
  const ev = [];
  let loading = false, failed = 0;
  const assets = incomeAssets();
  for (const { sec, a, kind } of assets) {
    const c = incomeCache[kind + '|' + a.id];
    if (!c) { loading = true; continue; }
    if (c.err) { failed++; continue; }
    for (const r of c.rows) {
      if (r.date < yearAgo) continue;
      const future = r.date >= today;
      const q = qtyOn(sec, a.id, r.rec);
      if (q <= 0) continue;
      const amount = r.value ? q * r.value : null;
      const pct = kind === 'div' ? purifyOf(a) : null;
      ev.push({
        sec, a, kind, future, q, date: r.date, per: r.value, amount, pct,
        purify: amount != null && pct != null ? amount * pct / 100 : null,
        key: a.id + '|' + r.date
      });
    }
  }
  ev.sort((x, y) => (x.date < y.date ? -1 : 1));
  return { ev, loading, failed, total: assets.length };
}

function incomeTeaser() {
  const { ev, loading } = incomeEvents();
  if (loading && !ev.length) return 'Загружаем выплаты…';
  const next = ev.find(e => e.future);
  const due = ev.filter(e => !e.future && e.purify && !purified[e.key]).reduce((s, e) => s + e.purify, 0);
  const parts = [];
  if (next) parts.push(next.a.name + ', ' + fmtDay(next.date) + (next.amount ? ': ≈ ' + rub(next.amount) : ''));
  if (due > 0) parts.push('к очищению ' + rub(due));
  return parts.length ? parts.join('; ') : 'Объявленных выплат нет';
}

function mountIncome() {
  const name = cur().name;
  if (name !== 'income' && name !== 'home') return;
  const need = incomeAssets().filter(({ a, kind }) => {
    const c = incomeCache[kind + '|' + a.id];
    return !c || Date.now() - c.at >= (c.err ? 120000 : INCOME_TTL);
  });
  if (!need.length) return;
  Promise.all(need.map(n => ensureIncome(n.kind, n.a))).then(() => {
    const el = document.activeElement;
    if (scrubbing || (el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName))) return;
    if (cur().name === name) render(false);
  });
}

function incomeRow(e) {

// ---------- графики ----------
const PERIODS = [
  { id: '1W', label: '1Н', days: 7,   word: 'За неделю' },
  { id: '1M', label: '1М', days: 30,  word: 'За месяц' },
  { id: '3M', label: '3М', days: 90,  word: 'За 3 месяца' },
  { id: '1Y', label: '1Г', days: 365, word: 'За год' }
];
let chartPeriod = '1M';
let chartAnimate = false;
let scrubbing = false;
const periodOf = id => PERIODS.find(p => p.id === id) || PERIODS[1];
const faceValues = {};
const rawCache = {};        // история цен: ключ → { at, t: [мс], v: [цены] }
const rawPending = {};
const RAW_TTL = 15 * 60 * 1000;

function periodSeg() {
  const i = PERIODS.findIndex(p => p.id === chartPeriod);
  return `<div class="seg seg-period" role="group" aria-label="Период графика" style="--n:${PERIODS.length};--i:${i}">${
    PERIODS.map(p => `<button data-act="period" data-v="${p.id}" class="${p.id === chartPeriod ? 'on' : ''}" aria-pressed="${p.id === chartPeriod}">${p.label}</button>`).join('')
  }</div>`;
}

const hasHistory = (sec, a) => !!(a && (sec === 'crypto' ? a.cg : sec === 'sukuk' ? a.moex : a.ticker));
const rawKey = (sec, id, period, cu) => [sec, id, period, sec === 'crypto' ? cu : 'rub'].join('|');
const rawSync = (sec, id, period, cu) => rawCache[rawKey(sec, id, period, cu)];
const isFresh = c => !!c && Date.now() - c.at < (c.err ? 120000 : RAW_TTL);

function downsample(t, v, max = 180) {
  if (t.length <= max) return { t, v };
  const T = [], V = [], step = (t.length - 1) / (max - 1);
  for (let i = 0; i < max; i++) { const k = Math.round(i * step); T.push(t[k]); V.push(v[k]); }
  return { t: T, v: V };
}

async function fetchRaw(sec, a, period, cu) {
  const P = periodOf(period);
  const t = [], v = [];
  if (sec === 'crypto') {
    const j = await fetchJSON('https://api.coingecko.com/api/v3/coins/' + a.cg + '/market_chart?vs_currency=' + cu + '&days=' + P.days);
    (j.prices || []).forEach(([ms, val]) => { if (val > 0) { t.push(ms); v.push(val); } });
  } else {
    const from = new Date(Date.now() - P.days * 86400000).toISOString().slice(0, 10);
    const base = sec === 'stocks'
      ? 'https://iss.moex.com/iss/engines/stock/markets/shares/boards/TQBR/securities/' + a.ticker
      : 'https://iss.moex.com/iss/engines/stock/markets/bonds/boards/' + a.moex.board + '/securities/' + a.moex.secid;
    const j = await fetchJSON(base + '/candles.json?from=' + from + '&interval=' + (period === '1W' ? 60 : 24) + '&iss.meta=off');
    const k = sec === 'sukuk' ? (faceValues[a.id] || 1000) / 100 : 1;    // сукук: % от номинала → рубли
    issRows(j.candles).forEach(r => {
      const ms = Date.parse(String(r.begin).replace(' ', 'T') + '+03:00');
      if (r.close > 0 && isFinite(ms)) { t.push(ms); v.push(r.close * k); }
    });
  }
  return downsample(t, v);
}

function ensureRaw(n) {
  const key = rawKey(n.sec, n.a.id, n.period, n.cur);
  if (isFresh(rawCache[key])) return Promise.resolve(rawCache[key]);
  if (!rawPending[key]) {
    rawPending[key] = fetchRaw(n.sec, n.a, n.period, n.cur)
      .then(r => (rawCache[key] = { at: Date.now(), t: r.t, v: r.v }))
      .catch(e => (rawCache[key] = { at: Date.now(), t: [], v: [], err: true, msg: String(e && e.message || e) }))
      .finally(() => { delete rawPending[key]; });
  }
  return rawPending[key];
}

// Цена на момент времени (между известными точками — по прямой)
function valueAt(raw, ms) {
  const t = raw.t;
  if (!t.length) return null;
  if (ms <= t[0]) return raw.v[0];
  let lo = 0, hi = t.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (t[mid] <= ms) lo = mid; else hi = mid - 1; }
  if (lo >= t.length - 1) return raw.v[lo];
  const k = (ms - t[lo]) / (t[lo + 1] - t[lo]);          // между двумя точками — плавно
  return raw.v[lo] + (raw.v[lo + 1] - raw.v[lo]) * k;
}

function portfolioNeeds(period, cu, onlySec) {
  const out = [];
  for (const sec of SECTIONS) {
    if (onlySec && sec !== onlySec) continue;
    for (const p of pf[sec]) {
      const a = p.a && findAsset(sec, p.a);
      if (hasHistory(sec, a)) out.push({ sec, a, period, cur: sec === 'crypto' ? cu : 'rub' });
    }
  }
  return out;
}

// Стоимость текущих позиций по историческим ценам. Последняя точка — текущие цены.
function buildPortfolio(period, cu) {
  const P = periodOf(period), N = 90, now = Date.now(), start = now - P.days * 86400000;
  const t = Array.from({ length: N }, (_, i) => start + (now - start) * i / (N - 1));
  const bySec = {};
  for (const sec of SECTIONS) {
    const c = sec === 'crypto' ? cu : 'rub';
    const v = new Array(N).fill(0);
    for (const p of pf[sec]) {
      const raw = p.a ? rawSync(sec, p.a, period, c) : null;
      const live = priceOf(p, c);
      for (let i = 0; i < N; i++) {
        const h = raw && i < N - 1 ? valueAt(raw, t[i]) : null;
        v[i] += p.q * (h == null ? live : h);
      }
    }
    bySec[sec] = { t, v };
  }
  return { total: { t, v: t.map((_, i) => SECTIONS.reduce((sum, sec) => sum + bySec[sec].v[i], 0)) }, bySec };
}

function assetSeries(sec, a, period, cu) {
  const raw = rawSync(sec, a.id, period, cu);
  if (!raw || !raw.t.length) return null;
  const t = raw.t.slice(), v = raw.v.slice();
  const live = livePrice(a.id, cu);
  if (live) { t.push(Date.now()); v.push(live); }
  return { t, v };
}

function chartSpec(el) {
  const kind = el.dataset.chart, sec = el.dataset.sec, period = chartPeriod;
  if (kind === 'asset') {
    const a = findAsset(sec, el.dataset.id), cu = dispCur(sec);
    return { kind, cur: cu, needs: [{ sec, a, period, cur: cu }], build: () => assetSeries(sec, a, period, cu) };
  }
  const cu = kind === 'section' ? dispCur(sec) : 'rub';
  const only = kind === 'portfolio' ? null : sec;
  return {
    kind, cur: cu, needs: portfolioNeeds(period, cu, only),
    build: () => { const b = buildPortfolio(period, cu); return only ? b.bySec[only] : b.total; }
  };
}

function mountCharts() {
  const animate = chartAnimate && !reduceMotion();
  chartAnimate = false;
  app.querySelectorAll('[data-chart]').forEach(el => {
    const spec = chartSpec(el);
    const cached = spec.needs.every(n => rawSync(n.sec, n.a.id, n.period, n.cur));
    const fresh = spec.needs.every(n => isFresh(rawSync(n.sec, n.a.id, n.period, n.cur)));
    if (cached) drawAny(el, spec, animate); else el.classList.add('loading');
    if (fresh) return;
    Promise.all(spec.needs.map(ensureRaw)).then(() => {
      if (!el.isConnected || scrubbing) return;
      el.classList.remove('loading');
      drawAny(el, spec, !cached && !reduceMotion());
    });
  });
}

function drawAny(el, spec, animate) {
  const raws = spec.needs.map(n => rawSync(n.sec, n.a.id, n.period, n.cur));
  const bad = raws.filter(r => r && (r.err || !r.t.length));
  if (spec.kind !== 'spark') {
    if (!spec.needs.length) return chartNote(el, 'Для активов, внесённых вручную, графика нет: у них нет истории цен.');
    if (bad.length === spec.needs.length) {
      const r = bad[0], src = spec.needs[0].sec === 'crypto' ? 'CoinGecko' : 'Мосбиржа';
      return chartNote(el, 'Не удалось загрузить историю цен (' + src + ': ' + (r.err ? r.msg : 'пустой ответ') + '). Попробуем снова через пару минут.');
    }
  } else if (spec.needs.length && bad.length === spec.needs.length) { el.innerHTML = ''; return; }
  const s = spec.build();
  if (spec.kind === 'portfolio' || spec.kind === 'section' || spec.kind === 'asset') drawChart(el, s, spec.cur, animate);
  else drawSpark(el, s);
}

function chartNote(el, text) {
  el.classList.remove('loading');
  el.innerHTML = '<div class="chart-empty"></div>';
  el.firstChild.textContent = text;
}

function fmtDate(ms, withTime) {
  const d = new Date(ms);
  const o = { day: 'numeric', month: 'short' };
  if (withTime) { o.hour = '2-digit'; o.minute = '2-digit'; }
  else if (chartPeriod === '1Y') o.year = 'numeric';
  return d.toLocaleString('ru-RU', o);
}

function geometry(v, W, H, padT, padB, padR) {
  let min = Math.min(...v), max = Math.max(...v);
  if (max === min) { const d = Math.abs(max) * 0.01 || 1; min -= d; max += d; }
  const n = v.length;
  return v.map((val, i) => [i / (n - 1) * (W - padR), padT + (1 - (val - min) / (max - min)) * (H - padT - padB)]);
}
const pathOf = pts => 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');

function drawChart(el, s, cu, animate) {
  el.classList.remove('loading');
  if (!s || s.v.length < 2) { el.innerHTML = '<div class="chart-empty">Нет данных для графика</div>'; return; }
  const P = periodOf(chartPeriod);
  const W = Math.max(200, Math.round(el.clientWidth || 340)), H = +el.dataset.h || 160;
  const pts = geometry(s.v, W, H, 10, 10, 6), n = pts.length;
  const ch = s.v[n - 1] - s.v[0];
  const dir = ch > 0 ? 'up' : ch < 0 ? 'down' : '';
  const line = pathOf(pts);
  const area = line + ` L${pts[n - 1][0].toFixed(1)} ${H} L0 ${H} Z`;
  el.innerHTML = `
    <div class="chart-meta"><span class="cm-a"></span><span class="cm-b"></span></div>
    <svg class="chart-svg ${dir}${animate ? ' draw' : ''}" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" tabindex="0" role="img">
      <path class="c-area" d="${area}"/>
      <path class="c-line" d="${line}" pathLength="1"/>
      <line class="c-cross" x1="0" x2="0" y1="0" y2="${H}" visibility="hidden"/>
      <circle class="c-dot" cx="${pts[n - 1][0]}" cy="${pts[n - 1][1]}" r="4"/>
    </svg>
    <div class="chart-axis"><span>${fmtDate(s.t[0])}</span><span>${fmtDate(s.t[n - 1])}</span></div>`;

  const svg = el.querySelector('svg'), cross = svg.querySelector('.c-cross'), dot = svg.querySelector('.c-dot');
  const a = el.querySelector('.cm-a'), b = el.querySelector('.cm-b');
  const base = s.v[0];
  svg.setAttribute('aria-label', P.word + ': ' + signedMoney(ch, cu) + (base ? ', ' + pctOf(ch, base) : ''));

  const idle = () => {
    a.className = 'cm-a hint'; a.textContent = P.word;
    b.className = 'cm-b ' + tone(ch); b.textContent = signedMoney(ch, cu) + (base ? ' (' + pctOf(ch, base) + ')' : '');
    cross.setAttribute('visibility', 'hidden');
    dot.setAttribute('cx', pts[n - 1][0]); dot.setAttribute('cy', pts[n - 1][1]);
  };
  let idx = n - 1;
  const show = i => {
    idx = Math.max(0, Math.min(n - 1, i));
    const [x, y] = pts[idx];
    cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', x); dot.setAttribute('cy', y);
    a.className = 'cm-a strong'; a.textContent = money(s.v[idx], cu);
    b.className = 'cm-b hint'; b.textContent = fmtDate(s.t[idx], P.id === '1W' || P.id === '1M');
  };
  const indexAt = e => {
    const r = svg.getBoundingClientRect();
    const x = Math.max(0, Math.min(r.width, e.clientX - r.left)) * (W / r.width);
    return Math.round(x / (W - 6) * (n - 1));
  };
  const end = () => { scrubbing = false; idle(); };
  svg.addEventListener('pointerdown', e => { scrubbing = true; show(indexAt(e)); });
  svg.addEventListener('pointermove', e => { if (scrubbing || e.pointerType === 'mouse') show(indexAt(e)); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => svg.addEventListener(ev, end));
  svg.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); show(idx + (e.key === 'ArrowLeft' ? -1 : 1)); }
    if (e.key === 'Escape') idle();
  });
  svg.addEventListener('blur', idle);
  idle();
}

function drawSpark(el, s) {
  if (!s || s.v.length < 2) { el.innerHTML = ''; return; }
  const W = 56, H = 26, n = s.v.length;
  const pts = geometry(s.v, W, H, 3, 3, 0);
  const ch = s.v[n - 1] - s.v[0];
  el.innerHTML = `<svg class="${ch > 0 ? 'up' : ch < 0 ? 'down' : ''}" viewBox="0 0 ${W} ${H}"><path class="c-line" d="${pathOf(pts)}"/></svg>`;
}

// Перерисовываем только графики и только при смене ширины экрана.
// Высота меняется, когда открывается клавиатура — в этот момент экран трогать нельзя,
// иначе поле ввода теряет фокус и клавиатура сразу закрывается.
let resizeTimer = 0, lastWidth = window.innerWidth;
window.addEventListener('resize', () => {
  if (window.innerWidth === lastWidth) return;
  lastWidth = window.innerWidth;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const el = document.activeElement;
    if (scrubbing || (el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName))) return;
    mountCharts();
  }, 200);
});

// ---------- тема ----------
// themePref: 'light' или 'dark', если пользователь выбрал вручную; null — как в Telegram.
let themePref = null;
try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') themePref = t; } catch (e) {}
const THEME_BG = { light: '#ffffff', dark: '#17181a' };

function systemTheme() {
  if (inTelegram) return tg.colorScheme === 'dark' ? 'dark' : 'light';
  try { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { return 'light'; }
}
const currentTheme = () => themePref || systemTheme();

function applyScheme() {
  const t = currentTheme();
  const root = document.documentElement;
  // В Telegram без ручного выбора берём его родные цвета; вне Telegram цвета задаём сами.
  if (themePref || !inTelegram) root.dataset.theme = t; else delete root.dataset.theme;
  root.dataset.scheme = t;
  if (inTelegram && atLeast('6.1')) {
    try {
      if (themePref && atLeast('6.9')) { tg.setHeaderColor(THEME_BG[t]); tg.setBackgroundColor(THEME_BG[t]); }
      else { tg.setHeaderColor('bg_color'); tg.setBackgroundColor('bg_color'); }
    } catch (e) {}
  }
}

function toggleTheme() {
  themePref = currentTheme() === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('theme', themePref); } catch (e) {}
  storeSet('theme', themePref);
  hapticSelect();
  applyScheme();
  const btn = $('[data-act="theme"]');
  if (btn) {
    const dark = themePref === 'dark';
    const label = dark ? 'Включить светлую тему' : 'Включить тёмную тему';
    btn.innerHTML = (dark ? ICON_SUN : ICON_MOON).replace('<svg', '<svg class="spin"');
    btn.setAttribute('aria-label', label);
    btn.title = label;
  } else render(false);
}

const ICON_MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

// ---------- полноэкранный режим ----------
// На телефонах открываемся на весь экран. Отступы берём из Telegram,
// чтобы содержимое не заезжало под часы и под кнопки «Закрыть» и «⋯».
const isPhone = () => inTelegram && ['ios', 'android', 'android_x'].includes(tg.platform);

function applyInsets() {
  if (!inTelegram) return;
  const safe = tg.safeAreaInset || {};
  const content = tg.contentSafeAreaInset || {};
  const root = document.documentElement.style;
  root.setProperty('--top-inset', ((safe.top || 0) + (content.top || 0)) + 'px');
  root.setProperty('--bottom-inset', ((safe.bottom || 0) + (content.bottom || 0)) + 'px');
}

function goFullscreen() {
  if (!isPhone() || !atLeast('8.0') || typeof tg.requestFullscreen !== 'function') return;
  try { if (!tg.isFullscreen) tg.requestFullscreen(); } catch (e) {}
}
// Запасной вариант: некоторые версии Telegram разрешают полный экран только после касания.
document.addEventListener('click', () => { if (isPhone() && !tg.isFullscreen) goFullscreen(); }, { capture: true, once: true });

async function init() {
  applyScheme();
  if (inTelegram) {
    tg.ready();
    tg.expand();
    goFullscreen();
    applyInsets();
    ['safeAreaChanged', 'contentSafeAreaChanged', 'fullscreenChanged', 'viewportChanged']
      .forEach(ev => { try { tg.onEvent(ev, applyInsets); } catch (e) {} });
    try { if (atLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
    if (atLeast('6.1')) tg.BackButton.onClick(back);
    tg.onEvent('themeChanged', applyScheme);
  }
  await loadAll();
  applyScheme();
  render();
  requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('no-trans')));
  refreshPrices();
  setInterval(() => { if (!document.hidden) refreshPrices(); }, 30000);
}
init();
</script>
