<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NAMA Invest</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #1a1a1a);
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 16px; line-height: 1.5; color: var(--tg-theme-hint-color, #777777); }
    #status {
      padding: 16px;
      border-radius: 10px;
      background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    }
  </style>
</head>
<body>
  <h1>NAMA Invest</h1>
  <p>Тестовая страница. Если ниже твоё имя, приложение подключено к Telegram.</p>
  <div id="status">Открыто в браузере, не в Telegram</div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (user) {
        document.getElementById('status').textContent =
          'Привет, ' + user.first_name + '! Telegram подключён.';
      }
    }
  </script>
</body>
</html>
