<style>

    margin: 0;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;

    line-height: 1.4;
    background: var(--bg);
    color: var(--text);

  main {
    padding: calc(16px + var(--top-inset, 0px)) 16px calc(84px + max(env(safe-area-inset-bottom), var(--bottom-inset, 0px)));

  .hint { color: var(--hint); font-size: 14px; }
  .num { font-variant-numeric: tabular-nums; }
  .big { font-size: 36px; font-weight: 650; letter-spacing: -0.8px; margin: 2px 0 2px; font-variant-numeric: tabular-nums; }
  .up, .row .sub.up { color: var(--up); }
  .down, .row .sub.down { color: var(--down); }

  .group { background: var(--bg2); border-radius: 14px; overflow: hidden; margin: 0 0 8px; }
  .row {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 13px 16px;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    color: inherit; font: inherit; text-align: left; cursor: pointer;

  .row:last-child { border-bottom: 0; }
  .row.static { cursor: default; }

  .row .sub { font-size: 13px; color: var(--hint); margin-top: 1px; }
  .row .right { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .right .sub { margin-top: 1px; }
  .chev { color: var(--hint); font-size: 18px; }
  .right-stack { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; white-space: nowrap; }

  .chip { display: inline-block; font-size: 12px; padding: 2px 7px; border-radius: 6px; border: 1px solid currentColor; white-space: nowrap; }
  .chip.ok { color: var(--up); }
  .chip.review { color: var(--warn); }
  .chip.pending { color: var(--hint); }

  .empty { padding: 18px 16px; color: var(--hint); font-size: 14px; }
  .note { font-size: 12px; color: var(--hint); line-height: 1.5; margin: 18px 2px 0; }

  .btn {
    display: block; width: 100%; padding: 14px; margin-top: 12px;
    border: 0; border-radius: 12px; cursor: pointer;
    font: inherit; font-weight: 600;
    background: var(--text); color: var(--bg);
  }
  .btn.ghost { background: var(--bg2); color: var(--text); }
  .btn.danger { background: transparent; color: var(--down); }
  .back { background: none; border: 0; color: var(--hint); font: inherit; padding: 0; margin-bottom: 12px; cursor: pointer; }

  label { display: block; font-size: 14px; color: var(--hint); margin: 16px 0 6px; }
  input, select {
    width: 100%; padding: 12px 14px; font: inherit; font-size: 16px;
    color: var(--text); background: var(--bg2);
    border: 1px solid var(--line); border-radius: 10px; outline: none;
    appearance: none; -webkit-appearance: none;
  }
  input:focus, select:focus { border-color: var(--hint); }
  .field-hint { font-size: 12px; color: var(--hint); margin-top: 6px; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg2); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 9px; border-radius: 8px; color: var(--hint); font: inherit; font-size: 15px; cursor: pointer; }
  .seg button.on { background: var(--bg); color: var(--text); font-weight: 600; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; border: 0; cursor: pointer;
    background: var(--bg2); color: var(--text);
    display: flex; align-items: center; justify-content: center;

  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .seg-sm { grid-template-columns: auto auto; flex-shrink: 0; }
  .seg-sm button { padding: 6px 14px; font-size: 15px; min-width: 44px; }

  .result { background: var(--bg2); border-radius: 14px; padding: 16px; margin-top: 20px; }
  .result .line { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-variant-numeric: tabular-nums; }
  .result .total { font-size: 22px; font-weight: 650; margin-top: 8px; }

  .detail-row:last-child { border-bottom: 0; }
  .detail-row span:first-child { color: var(--hint); }
  .detail-row span:last-child { text-align: right; }

  .lesson p { line-height: 1.6; }
  .steps { counter-reset: s; padding: 0; margin: 0; list-style: none; }
  .steps li { position: relative; padding: 0 0 16px 36px; line-height: 1.55; }
  .steps li::before {
    counter-increment: s; content: counter(s);
    position: absolute; left: 0; top: 0;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--bg2); font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;

  nav {

  nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

const nf = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
const round2 = v => Math.round(v * 100) / 100;
const rub = v => nf.format(round2(v)) + ' ₽';
const sign = v => (v > 0 ? '+' : v < 0 ? '−' : '');
const signedRub = v => sign(v) + nf.format(Math.abs(round2(v))) + ' ₽';
const SYM = { rub: '₽', usd: '$' };
const money = (v, c = 'rub') => nf.format(round2(v)) + ' ' + SYM[c];
const signedMoney = (v, c = 'rub') => sign(v) + nf.format(Math.abs(round2(v))) + ' ' + SYM[c];

const tone = v => (v > 0 ? 'up' : v < 0 ? 'down' : '');
const num = s => { const n = parseFloat(String(s).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : NaN; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    if (useCloud) {
      tg.CloudStorage.getItem(key, (err, val) => resolve(err ? null : (val || null)));
    } else {
      try { resolve(localStorage.getItem(key)); } catch (e) { resolve(null); }
    }
  });
}
function storeSet(key, val) {
  return new Promise(resolve => {
    if (useCloud) {
      tg.CloudStorage.setItem(key, val, err => resolve(!err));
    } else {
      try { localStorage.setItem(key, val); resolve(true); } catch (e) { resolve(false); }
    }
  });
}
async function loadAll() {
  for (const s of SECTIONS) {
    const raw = await storeGet('pf_' + s);
    try { const arr = JSON.parse(raw); pf[s] = Array.isArray(arr) ? arr : []; } catch (e) { pf[s] = []; }
  }
  const c = await storeGet('cur_crypto');
  if (c === 'rub' || c === 'usd') cryptoCur = c;
  const t = await storeGet('theme');
  if (t === 'light' || t === 'dark') {
    themePref = t;
    try { localStorage.setItem('theme', t); } catch (e) {}
  }
}
async function persist(sec) {
  const data = JSON.stringify(pf[sec]);
  if (data.length > 4000) { alertMsg('В разделе слишком много позиций. Удалите лишние.'); return false; }
  const ok = await storeSet('pf_' + sec, data);
  if (!ok) alertMsg('Не удалось сохранить. Проверьте интернет и попробуйте ещё раз.');
  return ok;
}

// ---------- сообщения ----------
function alertMsg(text) { if (inTelegram && atLeast('6.2')) tg.showAlert(text); else alert(text); }
function confirmMsg(text, cb) { if (inTelegram && atLeast('6.2')) tg.showConfirm(text, cb); else cb(confirm(text)); }
function haptic(type) { try { if (inTelegram && atLeast('6.1')) tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }

// ---------- живые цены ----------
const prices = {};                         // id актива → цена за 1 шт. в рублях
const changes = {};                        // id актива → изменение цены за день, %
const setChange = (id, v, target = changes) => { if (typeof v === 'number' && isFinite(v)) target[id] = v; };
const pricesUsd = {};                      // крипта: цена в долларах
const changesUsd = {};
let usdRub = null;                         // курс доллара в рублях
try { const r = parseFloat(localStorage.getItem('usd_rub')); if (r > 0) usdRub = r; } catch (e) {}
const priceErr = { moex: false, cg: false };
let pricesAt = null;

async function fetchJSON(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function issRows(block) {
  if (!block || !block.columns) return [];
  return block.data.map(row => { const o = {}; block.columns.forEach((c, i) => { o[c] = row[i]; }); return o; });
}
const firstPositive = (...vals) => vals.find(v => typeof v === 'number' && v > 0);

async function loadStockPrices() {
  const list = CATALOG.stocks.map(a => a.ticker).join(',');
  const j = await fetchJSON('https://iss.moex.com/iss/engines/stock/markets/shares/boards/TQBR/securities.json'
    + '?securities=' + list + '&iss.meta=off&iss.only=securities,marketdata');
  const prev = {};
  issRows(j.securities).forEach(r => { prev[r.SECID] = r.PREVPRICE; });
  issRows(j.marketdata).forEach(r => {
    const v = firstPositive(r.LAST, r.LCURRENTPRICE, r.MARKETPRICE, prev[r.SECID]);
    const a = CATALOG.stocks.find(x => x.ticker === r.SECID);
    if (a && v) prices[a.id] = v;
    if (a) setChange(a.id, r.LASTTOPREVPRICE);
  });
}

async function loadSukukPrices() {
  for (const a of CATALOG.sukuk) {
    if (!a.moex) continue;
    const j = await fetchJSON('https://iss.moex.com/iss/engines/stock/markets/bonds/boards/' + a.moex.board
      + '/securities/' + a.moex.secid + '.json?iss.meta=off&iss.only=securities,marketdata');
    const s = issRows(j.securities)[0] || {};
    const m = issRows(j.marketdata)[0] || {};
    const pct = firstPositive(m.LAST, m.LCURRENTPRICE, m.MARKETPRICE, s.PREVPRICE);
    if (pct && s.FACEVALUE > 0) prices[a.id] = pct / 100 * s.FACEVALUE;   // цена в % от номинала → рубли
    setChange(a.id, m.LASTTOPREVPRICE);
  }
}

async function loadCryptoPrices() {
  const ids = CATALOG.crypto.map(a => a.cg).filter(Boolean).join(',');
  if (!ids) return;
  const j = await fetchJSON('https://api.coingecko.com/api/v3/simple/price?ids=' + ids + '&vs_currencies=rub,usd&include_24hr_change=true');
  const rates = [];
  CATALOG.crypto.forEach(a => {
    const d = j[a.cg];
    if (!d) return;
    if (d.rub > 0) prices[a.id] = d.rub;
    if (d.usd > 0) pricesUsd[a.id] = d.usd;
    if (d.rub > 0 && d.usd > 0) rates.push(d.rub / d.usd);
    setChange(a.id, d.rub_24h_change);
    setChange(a.id, d.usd_24h_change, changesUsd);
  });
  if (rates.length) {
    usdRub = rates.reduce((s, r) => s + r, 0) / rates.length;
    try { localStorage.setItem('usd_rub', String(usdRub)); } catch (e) {}
  }
}

async function refreshPrices() {
  const [st, su, cr] = await Promise.allSettled([loadStockPrices(), loadSukukPrices(), loadCryptoPrices()]);
  priceErr.moex = st.status === 'rejected' && su.status === 'rejected';
  priceErr.cg = cr.status === 'rejected';
  pricesAt = new Date();
  if (['home', 'sukuk', 'stocks', 'crypto', 'asset'].includes(cur().name)) render(false);
}

function priceStatus() {
  if (!pricesAt) return 'Загружаем цены…';
  if (priceErr.moex && priceErr.cg) return 'Не удалось загрузить цены. Показаны последние сохранённые.';
  const t = pricesAt.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  let s = 'Цены обновлены в ' + t + ', обновляются каждые 30 секунд. Мосбиржа бесплатно отдаёт их с задержкой 15 минут. Процент — изменение за день.';
  if (priceErr.moex) s += ' Цены Мосбиржи сейчас недоступны.';
  if (priceErr.cg) s += ' Цены криптовалют сейчас недоступны.';
  return s;
}

function livePrice(id, c = 'rub') {
  const src = c === 'usd' ? pricesUsd : prices;
  return (id && src[id] > 0) ? src[id] : null;
}
function changeHtml(id, c = 'rub') {
  const v = (c === 'usd' ? changesUsd : changes)[id];
  if (typeof v !== 'number') return '';
  return ` <span class="${tone(v)}">${sign(v)}${nf.format(Math.abs(round2(v)))}%</span>`;
}
function priceLine(id, c = 'rub') {
  const v = livePrice(id, c);
  return v ? `<span class="num">${money(v, c)}${changeHtml(id, c)}</span>` : '';
}
// Перевод суммы между рублём и долларом по текущему курсу.
function conv(v, from, to) {
  if (from === to || !usdRub) return v;
  return from === 'usd' ? v * usdRub : v / usdRub;
}
const posCur = p => p.c || 'rub';
const priceOf = (p, c = 'rub') => livePrice(p.a, c) || conv(p.p, posCur(p), c);
const costOf = (p, c = 'rub') => conv(p.b, posCur(p), c);

// ---------- расчёты ----------
function secTotals(sec, c = 'rub') {
  let value = 0, cost = 0;
  for (const p of pf[sec]) { value += p.q * priceOf(p, c); cost += p.q * costOf(p, c); }
  return { value, cost, pl: value - cost };
}
function allTotals() {
  let value = 0, cost = 0;
  for (const s of SECTIONS) { const t = secTotals(s); value += t.value; cost += t.cost; }
  return { value, cost, pl: value - cost };
}
const findAsset = (sec, id) => CATALOG[sec].find(a => a.id === id);

// ---------- навигация ----------
const cur = () => stack[stack.length - 1];
function go(name, params) { stack.push(Object.assign({ name }, params || {})); render(); }
function back() { if (stack.length > 1) { stack.pop(); render(); } }
function tab(name) { stack = [{ name }]; render(); }

// ---------- общие куски разметки ----------
const backLink = () => (!inTelegram && stack.length > 1) ? '<button class="back" data-act="back">Назад</button>' : '';
const disclaimer = '<p class="note">Информация носит образовательный характер и не является индивидуальной инвестиционной рекомендацией.</p>';
const chip = st => `<span class="chip ${st}">${STATUS[st]}</span>`;

function positionRow(sec, p) {
  const c = dispCur(sec);
  const price = priceOf(p, c);
  const value = p.q * price, pl = value - p.q * costOf(p, c);
  return `<button class="row" data-go="edit" data-sec="${sec}" data-pid="${esc(p.i)}">
    <div class="main"><div class="title">${esc(p.n)}</div><div class="sub num">${nf.format(p.q)} шт. по ${money(price, c)}${p.a ? changeHtml(p.a, c) : ''}</div></div>
    <div class="right"><div>${money(value, c)}</div><div class="sub ${tone(pl)}">${signedMoney(pl, c)}</div></div>
  </button>`;
}

// Валюта формы: у существующей позиции — та, в которой её внесли; у новой — выбранная в разделе.
function editCur(c) {
  const p = c.pid ? pf[c.sec].find(x => x.i === c.pid) : null;
  return p ? posCur(p) : dispCur(c.sec);
}

      <div class="group">${docs}</div>
      ${COMMITTEE.contact ? '<button class="btn ghost" data-act="ask-committee">Задать вопрос комитету</button>' : ''}
      <p class="note">Пока комитет формируется, статусы акций основаны на шариатском индексе Мосбиржи MXSHAR.</p>
      ${disclaimer}`;
  },

  lessons() {
    return `
      ${backLink()}
      <h1>Уроки</h1>
      <div class="group" style="margin-top:16px">
        ${LESSONS.map((l, i) => `<button class="row" data-go="lesson" data-id="${l.id}">
          <div class="main"><div class="sub">Урок ${i + 1}</div><div class="title">${esc(l.title)}</div></div><span class="chev">›</span>
        </button>`).join('')}
      </div>`;
  },

  lesson(c) {
    const idx = LESSONS.findIndex(l => l.id === c.id);
    const l = LESSONS[idx];
    if (!l) return backLink() + '<p>Урок не найден.</p>';
    const next = LESSONS[idx + 1];
    return `
      ${backLink()}
      <p class="hint">Урок ${idx + 1} из ${LESSONS.length}</p>
      <h1>${esc(l.title)}</h1>
      <div class="lesson" style="margin-top:14px">${l.body.map(t => `<p>${esc(t)}</p>`).join('')}</div>
      ${next ? `<button class="btn ghost" data-act="next-lesson" data-id="${next.id}">Следующий урок</button>` : ''}`;
  },

  guide() {
    return `
      ${backLink()}
      <h1>Как открыть брокерский счёт</h1>
      <ol class="steps" style="margin-top:18px">${GUIDE_STEPS.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
      ${disclaimer}`;
  },

  zakat() {
    const field = (key, title, hint) => `
      <label for="zk-${key}">${title}</label>
      <input id="zk-${key}" data-zk="${key}" type="text" inputmode="decimal" value="${esc(zk[key])}" placeholder="0">
      ${hint ? `<div class="field-hint">${hint}</div>` : ''}`;
    return `
      ${backLink()}
      <h1>Калькулятор закята</h1>
      <label>Нисаб считать по</label>
      <div class="seg">
        <button data-act="zk-basis" data-v="gold" class="${zk.basis === 'gold' ? 'on' : ''}">Золоту, 85 г</button>
        <button data-act="zk-basis" data-v="silver" class="${zk.basis === 'silver' ? 'on' : ''}">Серебру, 595 г</button>
      </div>
      ${field('gram', `Цена 1 грамма ${zk.basis === 'gold' ? 'золота' : 'серебра'}, ₽`, 'Актуальную цену можно посмотреть на сайте ЦБ: учётные цены на драгоценные металлы.')}
      <h2>Ваше имущество</h2>
      ${field('cash', 'Наличные и деньги на счетах, ₽')}
      ${field('inv', 'Инвестиции, ₽')}
      <button class="btn ghost" data-act="zk-fill">Взять из портфеля: ${rub(allTotals().value)}</button>
      ${field('metal', 'Золото и серебро, ₽', 'Стоимость украшений и слитков.')}
      ${field('recv', 'Долги вам, ₽', 'Только те, которые вам реально вернут.')}
      <h2>Вычеты</h2>
      ${field('debt', 'Ваши долги к оплате, ₽')}
      <div class="result" id="zk-result">${zakatResult()}</div>
      <p class="note">Закят обязателен, если сумма не опускалась ниже нисаба в течение лунного года. По акциям мнения учёных расходятся: одни берут полную рыночную стоимость, другие — только долю оборотных активов компании. Калькулятор считает по полной стоимости, это осторожный вариант.</p>`;
  }
};
['sukuk', 'stocks', 'crypto'].forEach(s => { SCREENS[s] = SCREENS.section; });

function zakatResult() {
  const v = k => { const n = num(zk[k]); return isNaN(n) ? 0 : n; };
  const grams = zk.basis === 'gold' ? 85 : 595;
  const gram = num(zk.gram);
  const net = v('cash') + v('inv') + v('metal') + v('recv') - v('debt');
  if (!(gram > 0)) return '<div class="hint">Введите цену грамма, чтобы рассчитать нисаб.</div>';
  const nisab = grams * gram;
  let out = `<div class="line"><span class="hint">Нисаб</span><span>${rub(nisab)}</span></div>
             <div class="line"><span class="hint">Облагаемая сумма</span><span>${rub(net)}</span></div>`;
  if (net < nisab) out += '<div class="total">Закят не обязателен</div><div class="hint">Сумма ниже нисаба.</div>';
  else out += `<div class="line"><span class="hint">Ставка</span><span>2,5%</span></div><div class="total">К выплате: ${rub(net * 0.025)}</div>`;
  return out;
}

// ---------- действия ----------
async function savePosition() {
  const c = cur(), sec = c.sec;
  const aid = $('#f-asset').value;
  const asset = findAsset(sec, aid);
  const name = asset ? asset.name : $('#f-name').value.trim();
  const q = num($('#f-q').value), b = num($('#f-b').value);
  let price = num($('#f-p').value);
  if (!name) return alertMsg('Укажите название актива.');
  if (!(q > 0)) return alertMsg('Укажите количество больше нуля.');
  if (isNaN(b) || b < 0) return alertMsg('Укажите цену покупки.');
  if (isNaN(price) || price < 0) price = b;
  const fc = editCur(c);
  const live = asset ? livePrice(asset.id, fc) : null;
  if (live) price = live;

  const data = { a: asset ? asset.id : '', n: name, q, b, p: price, c: fc };
  const before = JSON.stringify(pf[sec]);
  if (c.pid) {
    const p = pf[sec].find(x => x.i === c.pid);
    if (p) Object.assign(p, data);
  } else {
    pf[sec].push(Object.assign({ i: Date.now().toString(36) }, data));
  }
  if (await persist(sec)) { haptic('success'); tab(sec); }
  else pf[sec] = JSON.parse(before);
}

function deletePosition() {
  const c = cur(), sec = c.sec;
  confirmMsg('Удалить позицию?', async ok => {
    if (!ok) return;
    const before = pf[sec];
    pf[sec] = pf[sec].filter(x => x.i !== c.pid);
    if (await persist(sec)) { haptic('success'); tab(sec); }
    else pf[sec] = before;
  });
}

const ACTIONS = {
  back,
  save: savePosition,
  delete: deletePosition,
  support: () => {
    const url = 'https://t.me/' + SUPPORT_USERNAME;
    if (inTelegram) tg.openTelegramLink(url); else window.open(url, '_blank');
  },
  'next-lesson': el => { stack[stack.length - 1] = { name: 'lesson', id: el.dataset.id }; render(); },
  'zk-basis': el => { zk.basis = el.dataset.v; render(false); },
  theme: toggleTheme,
  'open-doc': el => {
    const d = COMMITTEE.documents[+el.dataset.i];
    if (!d || !d.url) return;
    if (inTelegram) tg.openLink(d.url); else window.open(d.url, '_blank');
  },
  'ask-committee': () => {
    const url = 'https://t.me/' + COMMITTEE.contact;
    if (inTelegram) tg.openTelegramLink(url); else window.open(url, '_blank');
  },
  'set-cur': el => {
    if (cryptoCur === el.dataset.v) return;
    cryptoCur = el.dataset.v;
    render(false);
    storeSet('cur_crypto', cryptoCur);
  },
  'zk-fill': () => { zk.inv = String(round2(allTotals().value)); render(false); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-tab],[data-go],[data-act]');
  if (!el) return;
  if (el.dataset.tab) return tab(el.dataset.tab);
  if (el.dataset.go) {
    const params = Object.assign({}, el.dataset);
    delete params.go;
    return go(el.dataset.go, params);
  }
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el);
});

document.addEventListener('input', e => {
  const key = e.target.dataset && e.target.dataset.zk;
  if (key) { zk[key] = e.target.value; const r = $('#zk-result'); if (r) r.innerHTML = zakatResult(); }
});

function updatePriceField() {
  const sel = $('#f-asset');
  if (!sel) return;
  const fc = editCur(cur());
  const live = livePrice(sel.value, fc);
  $('#f-name-wrap').style.display = sel.value === '' ? 'block' : 'none';
  $('#f-p-wrap').style.display = live ? 'none' : 'block';
  $('#f-live').style.display = live ? 'block' : 'none';
  $('#f-live').textContent = live ? 'Текущая цена: ' + money(live, fc) + '. Обновляется автоматически.' : '';
}

document.addEventListener('change', e => {
  if (e.target.id === 'f-asset') updatePriceField();
});

// ---------- отрисовка ----------
function render(resetScroll = true) {
  const c = cur();
  const screen = SCREENS[c.name] || SCREENS.home;
  app.innerHTML = screen(c);
  const root = stack[0].name;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === root));
  if (c.name === 'edit') updatePriceField();
  if (inTelegram && atLeast('6.1')) { stack.length > 1 ? tg.BackButton.show() : tg.BackButton.hide(); }
  if (resetScroll) window.scrollTo(0, 0);
}

// ---------- тема ----------
// themePref: 'light' или 'dark', если пользователь выбрал вручную; null — как в Telegram.
let themePref = null;
try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') themePref = t; } catch (e) {}
const THEME_BG = { light: '#ffffff', dark: '#17181a' };

function systemTheme() {
  if (inTelegram) return tg.colorScheme === 'dark' ? 'dark' : 'light';
  try { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { return 'light'; }
}
const currentTheme = () => themePref || systemTheme();

function applyScheme() {
  const t = currentTheme();
  const root = document.documentElement;
  // В Telegram без ручного выбора берём его родные цвета; вне Telegram цвета задаём сами.
  if (themePref || !inTelegram) root.dataset.theme = t; else delete root.dataset.theme;
  root.dataset.scheme = t;
  if (inTelegram && atLeast('6.1')) {
    try {
      if (themePref && atLeast('6.9')) { tg.setHeaderColor(THEME_BG[t]); tg.setBackgroundColor(THEME_BG[t]); }
      else { tg.setHeaderColor('bg_color'); tg.setBackgroundColor('bg_color'); }
    } catch (e) {}
  }
}

function toggleTheme() {
  themePref = currentTheme() === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('theme', themePref); } catch (e) {}
  storeSet('theme', themePref);
  applyScheme();
  render(false);
}

const ICON_MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

// ---------- полноэкранный режим ----------
// На телефонах открываемся на весь экран. Отступы берём из Telegram,
// чтобы содержимое не заезжало под часы и под кнопки «Закрыть» и «⋯».
const isPhone = () => inTelegram && ['ios', 'android', 'android_x'].includes(tg.platform);

function applyInsets() {
  if (!inTelegram) return;
  const safe = tg.safeAreaInset || {};
  const content = tg.contentSafeAreaInset || {};
  const root = document.documentElement.style;
  root.setProperty('--top-inset', ((safe.top || 0) + (content.top || 0)) + 'px');
  root.setProperty('--bottom-inset', ((safe.bottom || 0) + (content.bottom || 0)) + 'px');
}

function goFullscreen() {
  if (!isPhone() || !atLeast('8.0') || typeof tg.requestFullscreen !== 'function') return;
  try { if (!tg.isFullscreen) tg.requestFullscreen(); } catch (e) {}
}
// Запасной вариант: некоторые версии Telegram разрешают полный экран только после касания.
document.addEventListener('click', () => { if (isPhone() && !tg.isFullscreen) goFullscreen(); }, { capture: true, once: true });

async function init() {
  applyScheme();
  if (inTelegram) {
    tg.ready();
    tg.expand();
    goFullscreen();
    applyInsets();
    ['safeAreaChanged', 'contentSafeAreaChanged', 'fullscreenChanged', 'viewportChanged']
      .forEach(ev => { try { tg.onEvent(ev, applyInsets); } catch (e) {} });
    try { if (atLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
    if (atLeast('6.1')) tg.BackButton.onClick(back);
    tg.onEvent('themeChanged', applyScheme);
  }
  await loadAll();
  applyScheme();
  render();
  refreshPrices();
  setInterval(() => { if (!document.hidden) refreshPrices(); }, 30000);
}
init();
</script>
